<!-- Menu Grid Section -->
<section id="menu">
  <div class="container menu-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Menu</h2>
        <hr class="leaf">
      </div>
    </div>
    <div class="menu-flex-row">
      {% for post in site.posts %}
      <div class="menu-flex-item menu-item">
        <a href="#menuModal-{{ post.modal-id }}" class="menu-link" data-toggle="modal">
          <div class="caption">
            <div class="caption-content">
              <i class="fa fa-search-plus fa-3x"></i>
            </div>
          </div>
          <img src="img/menu/{{ post.img }}" class="img-responsive" alt="{{ post.alt }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
