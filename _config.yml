# Site settings
title: Sarah R. Supp
email: supps@denison.edu
url: https://github.com/sarahsupp
description: "Professional website for Sarah R. Supp"
keywords: "data analytics, higher education, biodiversity change, macroecology"
skills: "Associate Professor of Data Analytics, Ph.D. Ecology"
